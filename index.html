<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Favicon created by Freepik -->
    <link rel="icon" type="image/png" href="assets/images/spyware.png">
    <title>Password Generator</title>
</head>

<body>
    <main>
        <section>
            <div>
                <h1>Welcome, press the button to generate a password</h1>
                <button id="btn">Generate Password</button>
                <div class="checkbox">
                    <input type="checkbox" id="symbol-check">
                    <label>Symbols</label>
                    <input type="checkbox" id="char-check">
                    <label>15+ Characters</label>
                    <input type="checkbox" id="num-check">
                    <label>Numbers</label>
                </div>
                <p id="generated-password"></p>
                <button id="copy-btn">Copy to clipboard</button>
                <p id="copied"></p>
            </div>
        </section>
    </main>

</body>
<script src="assets/js/app.js"></script>

</html>
